<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#130a26"/></linearGradient>
<linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f5a0"/><stop offset=".55" stop-color="#00d9f5"/><stop offset="1" stop-color="#7b2ff7"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f5a0" stop-opacity="0"/><stop offset=".5" stop-color="#00f5a0" stop-opacity=".22"/><stop offset="1" stop-color="#00f5a0" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00d9f5" stroke-opacity=".09"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="5s" repeatCount="indefinite"/></pattern>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect width="1000" height="340" rx="18"/></clipPath>
<style>
.e{stroke:#00d9f5;stroke-opacity:.4;stroke-width:1.2;stroke-dasharray:5 7;animation:flow 1.8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.n{fill:#00f5a0;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.55}50%{transform:scale(1.7);opacity:1}}
.name{font:800 82px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:2px}
.g1,.g2{opacity:0;font:800 82px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:2px;mix-blend-mode:screen}
.g1{fill:#ff2d75;animation:glitch 5s infinite}
.g2{fill:#00e5ff;animation:glitch 5s .08s infinite reverse}
@keyframes glitch{0%,88%,100%{transform:translate(0,0);opacity:0}89%{transform:translate(-5px,1px);opacity:.85}91%{transform:translate(5px,-2px);opacity:.85}93%{transform:translate(-3px,2px);opacity:.7}95%{transform:translate(0,0);opacity:0}}
.sub{font:500 24px 'Fira Code','JetBrains Mono','Courier New',monospace;fill:#7ee8ff}
.cur{fill:#00f5a0;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tag{font:500 13px 'Fira Code','JetBrains Mono','Courier New',monospace;fill:#00f5a0;letter-spacing:2px}
.chip{font:500 13px 'Fira Code','JetBrains Mono','Courier New',monospace;fill:#cfe9ff}
.sys{font:500 12px 'Fira Code','JetBrains Mono','Courier New',monospace;fill:#7b8ba3;letter-spacing:2px}
</style>
</defs>
